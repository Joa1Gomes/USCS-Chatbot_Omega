<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recuperar Senha - Chatbot Omega</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="../css/esqueceu_senha.css">
</head>
<body>

  <div class="recovery-container">
    <div class="recovery-card" id="cardContent">
      <!-- Formulário -->
      <div id="formView">
        <div class="mb-4"><i class="fas fa-lock fa-3x"></i></div>
        <h2 class="mb-3">Recuperar Senha</h2>
        <p class="text-muted mb-4">Informe seu e-mail empresarial e enviaremos um link para criar uma nova senha.</p>
        
        <form id="formRecuperacao">
          <div class="mb-3 text-start">
            <label class="form-label fw-bold">E-mail Empresarial</label>
            <input type="email" class="form-control" id="emailRecuperacao" placeholder="exemplo@empresa.com" required>
          </div>
          <button type="submit" class="btn-enviar">
            <i class="fas fa-paper-plane me-2"></i> Enviar Link de Recuperação
          </button>
        </form>
      </div>

      <!-- Mensagem de Sucesso (Estilizada) -->
      <div id="successView" class="success-message">
        <div class="success-icon"><i class="fas fa-check-circle"></i></div>
        <h2 class="mb-3">Link Enviado!</h2>
        <p class="text-muted mb-4">Verifique sua caixa de entrada. Enviamos as instruções para redefinir sua senha.</p>
        <a href="login.html" class="btn btn-outline-dark w-100">Voltar ao Login</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('formRecuperacao').addEventListener('submit', function(e) {
      e.preventDefault();
      
      // Oculta o formulário e mostra a mensagem
      document.getElementById('formView').style.display = 'none';
      document.getElementById('successView').style.display = 'block';
    });
  </script>
</body>
</html>
