<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Chatbot Omega</title>

  <!-- Bootstrap, Font Awesome e Google Fonts -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../css/login.css">

</head>

<body>

  <!-- ===== NAVBAR ===== -->
  <nav class="navbar navbar-expand-lg fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">
        <i class="fas fa-robot"></i> Chatbot Omega
      </a>
    </div>
  </nav>

  <!-- ===== ÁREA DE LOGIN ===== -->
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-icon">
          <i class="fas fa-lock"></i>
        </div>
        <h2 class="login-title">Bem-vindo de volta</h2>
        <p class="login-subtitle">Acesse sua conta para continuar</p>
      </div>

      <form id="formLogin">
        <div class="form-group">
          <label class="form-label" for="email">
            <i class="fas fa-envelope"></i> E-mail
          </label>
          <input type="email" class="form-control" id="email" placeholder="seu.email@exemplo.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="senha">
            <i class="fas fa-key"></i> Senha
          </label>
          <div class="password-wrapper">
            <input type="password" class="form-control" id="senha" placeholder="Digite sua senha" required>
            <button type="button" class="password-toggle" onclick="togglePassword()">
              <i class="fas fa-eye" id="eyeIcon"></i>
            </button>
          </div>
        </div>

        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="lembrar">
          <label class="form-check-label" for="lembrar">
            Lembrar-me neste dispositivo
          </label>
        </div>

        <button type="submit" class="btn-login">
          <i class="fas fa-sign-in-alt"></i> Entrar
        </button>
      </form>

      <div class="login-links">
        <a href="#" class="login-link">Esqueci minha senha</a>
        <a href="../html/cadastro.html" class="login-link">Criar conta</a>
      </div>
    </div>
  </div>

  <!-- ===== FOOTER ===== -->
  <footer>
    <p>© 2025 Chatbot Omega - Todos os direitos reservados</p>
  </footer>

  <script src="../js/login.js"></script>
  <script>
    function togglePassword() {
      const senhaInput = document.getElementById('senha');
      const eyeIcon = document.getElementById('eyeIcon');

      if (senhaInput.type === 'password') {
        senhaInput.type = 'text';
        eyeIcon.classList.remove('fa-eye');
        eyeIcon.classList.add('fa-eye-slash');
      } else {
        senhaInput.type = 'password';
        eyeIcon.classList.remove('fa-eye-slash');
        eyeIcon.classList.add('fa-eye');
      }
    }
  </script>
</body>

</html>
