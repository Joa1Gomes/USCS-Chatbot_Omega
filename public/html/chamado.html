  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../css/chamado.css">
</head>

<body>

  <!-- Cabeçalho da pagina com menu  -->
  <nav class="navbar navbar-expand-lg fixed-top">
    <div class="container-fluid">
      <!-- Botão menu -->

        <i class="fas fa-bars"></i>
      </button>

      <!-- Nome/logo -->
      <a class="navbar-brand" href="#">Chatbot Omega</a>

      <!-- Ícone de perfil -->
      <div class="ms-auto">
        <a href="#" class="nav-profile">
          <i class="fas fa-user-circle"></i>
        </a>
      </div>
    </div>
  </nav>

  <!-- Menu lateral -->
  <div class="offcanvas offcanvas-start" tabindex="-1" id="menuLateral">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title">Menu</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
      <ul class="list-unstyled" id="menuLista">
        <li><a href="home_page.html">🏠 Início</a></li>
        <!--<li><a href="gerenciamento_adm.html">🧑‍💼 Gerenciamento de Usuários</a></li> -->
        <li class="active"><a href="chamado.html">📋 Chamados</a></li>
        <li><a href="estatisticas.html">📊 Estatísticas</a></li>
        <li><a href="configuracao.html">⚙️ Configurações</a></li>
        <li><a href="chat.html">📞 Atendimentos</a></li>
        <li><a href="fale_conosco.html">💬 Fale conosco</a></li>
      </ul>
    </div>
  </div>

  <!-- Espaço do conteúdo -->
  <div class="content mt-5 pt-4">
    <h2>Chamados</h2>
    <p>Acompanhe e gerencie todos os seus chamados de suporte</p>

    <!-- ===== SEÇÃO DE FILTROS ===== -->
    <!--
      .filtros-wrapper  → reserva altura fixa para toda a área de filtros
      .filtros-row      → flex-row com os grupos de filtro
      .filtro-box       → cada coluna (dropdown + tags), com min-height reservada
      Os menus dropdown usam position:absolute, então abrir/fechar
      NÃO desloca nenhum elemento abaixo desta seção.
    -->
    <div class="filtros-wrapper">
      <div class="filtros-row">

        <!-- FILTRO: LOJAS -->
        <div class="filtro-box">
          <div class="multi-dropdown" id="filtroLojas">
            <button class="multi-dropdown-btn" type="button">Lojas</button>
            <ul class="multi-dropdown-menu" id="lojasDropdown"></ul>
          </div>
          <div class="multi-selected-tags" id="tagsSelecionadas"></div>
        </div>

        <!-- FILTRO: STATUS -->
        <div class="filtro-box">
          <div class="multi-dropdown" id="filtroStatus">
            <button class="multi-dropdown-btn" type="button">Status</button>
            <ul class="multi-dropdown-menu" id="statusDropdown"></ul>
          </div>
          <div class="multi-selected-tags" id="tagsSelecionadas2"></div>
        </div>

        <!-- FILTRO: PRIORIDADE -->
        <div class="filtro-box">
          <div class="multi-dropdown" id="filtroPrioridade">
            <button class="multi-dropdown-btn" type="button">Prioridade</button>
            <ul class="multi-dropdown-menu" id="prioridadeDropdown"></ul>
          </div>
          <div class="multi-selected-tags" id="tagsSelecionadas3"></div>
        </div>

        <!-- FILTRO: DATA (range) -->
        <div class="range-date-box">
          <div class="range-calendar-box">
            <div class="date-input-group">
              <input type="date" id="dataInicio" title="Data inicial">
              <span class="date-sep">até</span>
              <input type="date" id="dataFim" title="Data final">
            </div>
          </div>
          <div class="date-range-hint" id="dateRangeHint"></div>
          <button class="btn-filtrar-data">Filtrar</button>
          <button class="btn-filtrar-data" id="btnLimparFiltros">Limpar</button>
        </div>

      </div><!-- fecha filtros-row -->
    </div><!-- fecha filtros-wrapper -->
    <!-- ===== FIM FILTROS ===== -->

    <div class="chamados-container" id="chamadosContainer"></div>

  </div><!-- fecha content -->

  <!-- Modal de Edição -->
  <div class="modal fade" id="modalChamado" tabindex="-1" aria-labelledby="modalChamadoLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalChamadoLabel">Editar Chamado</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <form id="formChamado">
            <div class="mb-3">
              <label for="chamadoStatus" class="form-label">Status</label>
              <select class="form-select" id="chamadoStatus">
                <option value="aberto">Aberto</option>
                <option value="em_andamento">Em Andamento</option>
                <option value="resolvido">Resolvido</option>
                <option value="encerrado">Encerrado</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="chamadoPrioridade" class="form-label">Prioridade</label>
              <select class="form-select" id="chamadoPrioridade">
                <option value="alta">Alta</option>
                <option value="media">Média</option>
                <option value="baixa">Baixa</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="chamadoDescricao" class="form-label">Descrição</label>
              <textarea class="form-control" id="chamadoDescricao" rows="3"></textarea>
            </div>
            <button type="submit" class="btn btn-editar w-100">Salvar Alterações</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Rodapé -->
  <footer>
    <p>© 2025 Chatbot Omega - Todos os direitos reservados</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/chamado.js"></script>

</body>

</html>
